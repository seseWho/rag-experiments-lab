[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-experiments-lab"
version = "0.1.0"
description = "Laboratory for reproducible Retrieval-Augmented Generation (RAG) experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pytest>=8.0.0",
  "openai>=1.40.0",
  "langchain>=0.2.0",
  "langchain-openai>=0.1.0",
  "gradio>=4.40.0",
  "pandas>=2.0.0",
]

[tool.setuptools]
packages = ["rag_core", "ui"]
